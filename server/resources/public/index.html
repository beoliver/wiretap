<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Example</title>
    <!-- include style.css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Connection  -->
    <div id="repl-connection">
      <label for="port">nREPL port:</label>
      <input type="text" id="port" name="port" />
      <button id="connectButton">Connect</button>
    </div>
    <div id="container">      
      <div id="loaded-libs">
        <button onclick="toggleWidth('loaded-libs')">Toggle Loaded Libs</button>        
      </div>
      <div id="definitions">
        <button onclick="toggleWidth('definitions')">Toggle Definitions</button>        
      </div>
      <div id="traces">
        <button onclick="toggleWidth('traces')">Toggle Traces</button>        
      </div>
      <div id="value">
        <button onclick="toggleWidth('value')">Toggle Value</button>        
      </div>      
    </div>
    <!-- include script.js -->
    <script src="app.js"></script>
  </body>
</html>
